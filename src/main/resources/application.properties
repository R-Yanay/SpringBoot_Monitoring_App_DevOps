# Server Konfiguration
server.port=8080

# Actuator Endpunkte freigeben
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true

# Prometheus Metriken-Format
management.metrics.export.prometheus.enabled=true

# Anwendungsinformationen
info.app.name=Spring Boot Monitoring App
info.app.description=DevOps Monitoring Demo mit Prometheus und Grafana
info.app.version=@project.version@

# Metriken Konfiguration
management.metrics.tags.application=spring-boot-monitoring

# Access Logs für Loki (auf stdout, damit Promtail sie sammelt)
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=stdout
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b "%{Referer}i" "%{User-Agent}i"
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.prefix=
server.tomcat.accesslog.file-date-format=
