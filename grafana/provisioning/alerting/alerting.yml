apiVersion: 1

alerting:
  alertmanager:
    enabled: false

  rules:
    - name: 'alerting-rules'
      type: 'prometheus'
      orgId: 1
      uid: 'spring-boot-alerts'
      query:
        query: 'file:///etc/grafana/provisioning/alerting/alerting-rules.yml'
      datasource:
        uid: 'prometheus'
      groupBy: ''
      interval: ''
        ruleGroups:
          - orgId: 1
            name: 'Spring Boot Alerts'
            folderUid: 'spring-boot'
            interval: '1m'
            rules:
              - uid: 'cpu-warning'
                title: 'CPU Warning'
                condition: 'B'
                data:
                  - refId: 'A'
                    datasourceUid: 'prometheus'
                    queryType: 'randomWalk'
                    relativeTimeRange:
                      from: 300
                      to: 0
                    expr: 'system_cpu_usage > 0.8'
                  - refId: 'B'
                    datasourceUid: '__expr__'
                    queryType: ''
                    relativeTimeRange:
                      from: 0
                      to: 0
                    expr: 'A > 0'
                dashboardUid: ''
                panelId: 0
                noDataState: 'NoData'
                execErrState: 'Alerting'
                for: 300s
                annotations:
                  summary: 'CPU-Auslastung ist hoch'
                  description: 'CPU Usage ist seit 5 Minuten über 80%'
                labels:
                  severity: 'warning'
                  team: 'backend'

              - uid: 'memory-warning'
                title: 'Memory Warning'
                condition: 'B'
                data:
                  - refId: 'A'
                    datasourceUid: 'prometheus'
                    queryType: 'randomWalk'
                    relativeTimeRange:
                      from: 300
                      to: 0
                    expr: 'jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85'
                  - refId: 'B'
                    datasourceUid: '__expr__'
                    queryType: ''
                    relativeTimeRange:
                      from: 0
                      to: 0
                    expr: 'A > 0'
                dashboardUid: ''
                panelId: 0
                noDataState: 'NoData'
                execErrState: 'Alerting'
                for: 300s
                annotations:
                  summary: 'JVM Heap-Speicher ist fast voll'
                  description: 'Heap-Speicher ist seit 5 Minuten über 85%'
                labels:
                  severity: 'warning'
                  team: 'backend'

              - uid: 'error-rate-critical'
                title: 'Error Rate Critical'
                condition: 'B'
                data:
                  - refId: 'A'
                    datasourceUid: 'prometheus'
                    queryType: 'randomWalk'
                    relativeTimeRange:
                      from: 300
                      to: 0
                    expr: 'rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.05'
                  - refId: 'B'
                    datasourceUid: '__expr__'
                    queryType: ''
                    relativeTimeRange:
                      from: 0
                      to: 0
                    expr: 'A > 0'
                dashboardUid: ''
                panelId: 0
                noDataState: 'NoData'
                execErrState: 'Alerting'
                for: 120s
                annotations:
                  summary: 'Hohe Fehler-Rate bei HTTP-Anfragen'
                  description: 'Mehr als 5% der Anfragen enden mit Fehler 500'
                labels:
                  severity: 'critical'
                  team: 'backend'

              - uid: 'app-down-critical'
                title: 'App Down Critical'
                condition: 'B'
                data:
                  - refId: 'A'
                    datasourceUid: 'prometheus'
                    queryType: 'randomWalk'
                    relativeTimeRange:
                      from: 60
                      to: 0
                    expr: 'up{job="spring-boot-app"} == 0'
                  - refId: 'B'
                    datasourceUid: '__expr__'
                    queryType: ''
                    relativeTimeRange:
                      from: 0
                      to: 0
                    expr: 'A > 0'
                dashboardUid: ''
                panelId: 0
                noDataState: 'NoData'
                execErrState: 'Alerting'
                for: 60s
                annotations:
                  summary: 'Spring Boot App ist nicht erreichbar'
                  description: 'Die App ist seit 1 Minute nicht mehr antwortbereit'
                labels:
                  severity: 'critical'
                  team: 'backend'
